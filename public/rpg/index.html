<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Service RPG</title>
    <link rel="stylesheet" href="./game.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-heading">
        <h1>Public Service RPG</h1>
        <p id="game-status" role="status" aria-live="polite">Loading office scene…</p>
      </header>
      <canvas id="game-canvas" width="960" height="540" aria-label="Public service office game map"></canvas>
      <p class="controls">Move with Arrow keys or WASD. Use the on-screen D-pad from the host when available.</p>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
